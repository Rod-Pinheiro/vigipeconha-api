services:
  db:
    image: postgres:15-alpine
    container_name: vigipeconha_api_db
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - vigipeconha_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: vigipeconha_api_minio
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - vigipeconha_network

  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: vigipeconha_api
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      - NODE_ENV=production
      - DOCKER=true
      - DB_HOST=db
      - PORT=3001
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - vigipeconha_network
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3001/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - '3001:3001'

volumes:
  db_data:
  minio_data:

networks:
  vigipeconha_network:
    driver: bridge
